<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | FoodNow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/jpeg" href="images\images (6).png">
    <link rel="icon" type="image/png" href="images\images (6).png">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#F97316', dark: '#0F172A', card: '#1E293B' },
                    fontWeight: {
                        semibold: '500',
                        bold: '600',
                        extrabold: '800',
                        black: '900'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        /* =========================================
           CORE STYLES & ZERO SCROLL GUARANTEE
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh !important;
            width: 100vw !important;
            overflow: hidden !important;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* === FOODNOW COLOR THEME === */
        :root {
            --bg-color: #FFF7ED;
            --bg-card: #FFFFFF;
            --card-border: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;

            --input-bg: #F8FAFC;
            --input-border: #CBD5E1;
            --input-focus-bg: #FFFFFF;
            --input-text: #0F172A;
            --input-icon: #94A3B8;

            --page-text: #475569;
            --toggle-bg: #E2E8F0;
            --tab-bg: #F1F5F9;

            --accent-color: #F97316;
            --accent-hover: #EA580C;
            --btn-text: #FFFFFF;

            --radius: 20px;
            --shadow: 0 20px 45px -12px rgba(249, 115, 22, 0.12), 0 0 1px 1px rgba(0, 0, 0, 0.04);
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-color: #0F172A;
            --bg-card: #1E293B;
            --card-border: #334155;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;

            --input-bg: #0F172A;
            --input-border: #334155;
            --input-focus-bg: #111827;
            --input-text: #F8FAFC;
            --input-icon: #64748B;

            --page-text: #E2E8F0;
            --toggle-bg: #334155;
            --tab-bg: #0F172A;

            --accent-color: #F97316;
            --accent-hover: #EA580C;
            --btn-text: #FFFFFF;

            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--bg-color);
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Ambient Culinary Glow Background */
        .ambient-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(50px);
        }

        .ambient-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249, 115, 22, 0.08) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(60px);
        }

        /* RTL SUPPORT */
        [dir="rtl"] {
            text-align: right;
        }

        [dir="rtl"] .ml-2 {
            margin-left: 0;
            margin-right: 0.5rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 14px;
        }

        [dir="rtl"] .input-field {
            padding: 0 40px 0 14px !important;
        }

        [dir="rtl"] .password-field {
            padding-right: 42px !important;
            padding-left: 36px !important;
        }

        [dir="rtl"] .password-toggle {
            right: auto;
            left: 12px;
        }

        /* =========================================
           TOP CONTROLS BAR
           ========================================= */
        .top-bar {
            position: absolute;
            top: 0;
            right: 0;
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 50;
        }

        .toggle {
            width: 38px;
            height: 20px;
            background: var(--toggle-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode .toggle::before {
            left: 20px;
            background: var(--accent-color);
        }

        .top-btn-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--page-text);
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            padding: 5px 11px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .top-btn-text:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* =========================================
           UNIFIED COMPACT CARD DESIGN
           ========================================= */
        .auth-card {
            width: 100%;
            max-width: 580px;
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(1.25rem, 2.5vh, 1.75rem) clamp(1.25rem, 2.8vw, 2.25rem);
            position: relative;
            z-index: 10;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        /* Top decorative gradient bar */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-color), #FB923C, var(--accent-hover));
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 100% IDENTICAL LOGO STYLING */
        .auth-logo a {
            color: var(--text-main) !important;
            text-decoration: none;
        }

        /* SEGMENTED PILL SWITCHER */
        .segment-tabs {
            display: flex;
            background: var(--tab-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 3px;
            width: 100%;
            max-width: 260px;
            margin: 0 auto 1.15rem auto;
        }

        .segment-tab {
            flex: 1;
            text-align: center;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 9px;
            text-decoration: none;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .segment-tab.active {
            background: var(--bg-card);
            color: var(--accent-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .segment-tab:hover:not(.active) {
            color: var(--text-main);
        }

        /* FORM & INLINE INPUTS ROW */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 480px) {
            .form-row-2 {
                grid-template-columns: 1fr 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            font-size: 0.85rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-field {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 40px;
            border: 1.5px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--input-text);
            border-radius: 11px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .input-field::placeholder {
            color: var(--input-icon);
            opacity: 1;
            font-weight: 400;
        }

        .input-field:hover {
            border-color: #94A3B8;
        }

        body.dark-mode .input-field:hover {
            border-color: #64748B;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: var(--input-focus-bg);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }

        .input-field:focus+.input-icon,
        .input-field:focus~.input-icon {
            color: var(--accent-color);
        }

        .password-field {
            padding-right: 36px !important;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-icon);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            font-size: 0.85rem;
            z-index: 5;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--accent-color);
        }

        /* UTILITY ROW */
        .utility-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2px;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .custom-checkbox input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 16px;
            width: 16px;
            background-color: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .custom-checkbox input:checked~.checkmark {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .custom-checkbox input:checked~.checkmark::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 9px;
        }

        body.dark-mode .custom-checkbox input:checked~.checkmark::after {
            color: var(--text-main);
        }

        /* SUBMIT BUTTON */
        .auth-btn {
            width: 100%;
            height: 44px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 11px;
            font-size: 0.85rem;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
            margin-top: 4px;
        }

        .auth-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.3);
            transform: translateY(-1px);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        /* DIVIDER */
        .divider {
            text-align: center;
            position: relative;
            margin: 12px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--card-border);
        }

        .divider span {
            position: relative;
            background: var(--bg-card);
            padding: 0 14px;
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 1;
        }

        /* SOCIAL BUTTONS */
        .social-login {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            height: 40px;
            border: 1.5px solid var(--input-border);
            border-radius: 10px;
            background-color: var(--input-bg);
            font-size: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(249, 115, 22, 0.05);
            transform: translateY(-1px);
        }

        /* FOOTER LINK */
        .login-link {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 10px;
        }

        .login-link a {
            color: var(--accent-color);
            font-weight: 800;
            text-decoration: none;
            transition: all 0.2s;
        }

        .login-link a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
    </style>
</head>

<body class="p-4">

    <!-- Decorative Ambient Glows -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="flex items-center gap-2" style="cursor: pointer;"
            onclick="document.getElementById('theme-toggle').click()">
            <i class="fas fa-sun text-xs" style="color: var(--page-text); transition: color 0.3s;"></i>
            <div class="toggle" id="theme-toggle"></div>
            <i class="fas fa-moon text-xs" style="color: var(--page-text); transition: color 0.3s;"></i>
        </div>
        <button id="rtl-toggle" class="top-btn-text">RTL Mode</button>
    </div>

    <!-- MAIN COMPACT AUTH CARD -->
    <div class="auth-card">
        <!-- Logo matching index.html -->
        <div class="auth-logo flex justify-center mb-3">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-black tracking-tight text-gray-900 dark:text-white hover:opacity-80 transition-opacity">
                <i class="fas fa-fire text-brand"></i>FoodNow
            </a>
        </div>

        <!-- SEGMENTED TABS (Instant Switch to Register) -->
        <div class="segment-tabs">
            <a href="login.html" class="segment-tab active">Sign In</a>
            <a href="register.html" class="segment-tab">Register</a>
        </div>

        <!-- HEADER -->
        <div class="text-center mb-4">
            <h2 class="text-xl font-black text-[var(--text-main)] tracking-tight">Welcome Back, Chef</h2>
            <p class="text-xs text-[var(--text-muted)] mt-0.5 font-medium">Access your student recipes and class schedule</p>
        </div>

        <!-- FORM WITH INLINE INPUTS -->
        <form id="login-form">
            <!-- INPUTS IN A LINE (SIDE BY SIDE) -->
            <div class="form-row form-row-2">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="input-field" placeholder="student@foodnow.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-field password-field" placeholder="••••••••" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" id="toggle-password" tabindex="-1"
                            aria-label="Toggle password visibility">
                            <i class="fas fa-eye" id="toggle-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- UTILITY ROW -->
            <div class="utility-row">
                <label class="custom-checkbox">
                    <input type="checkbox">
                    <div class="checkmark"></div>
                    <span class="ml-2 text-[0.73rem] font-semibold" style="color: var(--text-muted);">Remember me</span>
                </label>
                <a href="#" class="text-[0.73rem] font-bold hover:underline" style="color: var(--accent-color);">Forgot Password?</a>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" class="auth-btn">
                Sign In <i class="fas fa-arrow-right ml-2 text-xs"></i>
            </button>
        </form>

        <div class="divider"><span>Or continue with</span></div>

        <!-- 3 SOCIAL BUTTONS -->
        <div class="social-login">
            <button class="social-btn" type="button" title="Sign in with Google"><i class="fab fa-google"></i></button>
            <button class="social-btn" type="button" title="Sign in with Apple"><i class="fab fa-apple"></i></button>
            <button class="social-btn" type="button" title="Sign in with X"><i class="fa-brands fa-x-twitter"></i></button>
        </div>

        <div class="login-link">
            New to the studio? <a href="register.html">Create an Account</a>
        </div>
    </div>

    <script>
        // --- THEME LOGIC ---
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'light';

        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.documentElement.classList.add('dark');
            themeToggle.classList.add('active');
        }

        themeToggle.onclick = (e) => {
            e.stopPropagation();
            document.body.classList.toggle('dark-mode');
            document.documentElement.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggle.classList.toggle('active', isDark);
        };

        // --- RTL LOGIC ---
        const rtlToggle = document.getElementById('rtl-toggle');
        const savedDir = localStorage.getItem('dir') || 'ltr';

        if (savedDir === 'rtl') {
            document.documentElement.dir = 'rtl';
            rtlToggle.innerText = "LTR MODE";
        }

        rtlToggle.onclick = () => {
            const isRTL = document.documentElement.dir === 'rtl';
            document.documentElement.dir = isRTL ? 'ltr' : 'rtl';
            localStorage.setItem('dir', isRTL ? 'ltr' : 'rtl');
            rtlToggle.innerText = isRTL ? 'RTL MODE' : 'LTR MODE';
        };

        // --- PASSWORD TOGGLE LOGIC ---
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        });

        // --- FORM SUBMISSION ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'user.html';
        });
    </script>
</body>

</html>
